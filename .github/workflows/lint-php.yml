name: Lint PHP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Syntax-check every PHP file
        run: |
          err=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f"; then
              err=1
            fi
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          exit $err
